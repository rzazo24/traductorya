<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Traductor</title>

<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#12151a">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Traductor">

<script>
// Aplica el tema antes del primer render para evitar el flash del tema
// equivocado (oscuro por defecto en :root) al cargar. El resto de la
// lógica del toggle vive en el script principal, al final del body.
(function () {
  try {
    var stored = localStorage.getItem('traductorya:theme');
    var theme = stored === 'light' || stored === 'dark'
      ? stored
      : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    // Siempre explícito (no solo para "light"): si el sistema está en claro
    // pero el usuario eligió "dark" a mano, hace falta el atributo
    // data-theme="dark" para que la media query de preferencia del sistema
    // no lo pise.
    document.documentElement.setAttribute('data-theme', theme);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'light' ? '#f5f6f8' : '#12151a');
  } catch (e) {}
})();
</script>
<style>
  :root {
    --bg: #12151a;
    --panel: #1a1f27;
    --panel-border: #262d38;
    --text: #e7e9ec;
    --text-dim: #8a93a3;
    --accent: #55b3a4;
    --accent-dim: #3d8577;
    --accent-hover: #67c2b3;
    --danger: #d9776a;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color-scheme: dark;
  }

  /* Tema claro: por preferencia del sistema... */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --panel-border: #dde1e7;
      --text: #14171c;
      --text-dim: #6b7280;
      --accent: #2f8f7f;
      --accent-dim: #256b60;
      --accent-hover: #3aa792;
      --danger: #c94f3f;
      color-scheme: light;
    }
  }

  /* ...o forzado a mano con el botón de tema (independiente del sistema) */
  :root[data-theme="light"] {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --panel-border: #dde1e7;
    --text: #14171c;
    --text-dim: #6b7280;
    --accent: #2f8f7f;
    --accent-dim: #256b60;
    --accent-hover: #3aa792;
    --danger: #c94f3f;
    color-scheme: light;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }

  /* Scrollbars a juego con el diseño oscuro (Firefox) */
  html {
    scrollbar-width: thin;
    scrollbar-color: var(--panel-border) var(--bg);
  }
  textarea {
    scrollbar-width: thin;
    scrollbar-color: var(--panel-border) var(--panel);
  }

  /* Scrollbars a juego con el diseño oscuro (Chrome, Safari, Edge) */
  ::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: var(--panel-border);
    border-radius: 6px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--accent-dim);
  }

  /* ---------- Login ---------- */
  #login-screen {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
      max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
  }

  #login-card {
    width: 100%;
    max-width: 340px;
    text-align: left;
  }

  .login-card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  #login-card .mark {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.02em;
  }

  #login-card h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 24px;
  }

  #login-card input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-size: 16px; /* evita el auto-zoom de iOS al enfocar el input */
    padding: 12px 14px;
    border-radius: 8px;
    outline: none;
    font-family: var(--sans);
  }

  #login-card input:focus {
    border-color: var(--accent-dim);
  }

  #login-form button {
    width: 100%;
    margin-top: 12px;
    background: var(--accent);
    color: #0d1210;
    border: none;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 14px;
    border-radius: 8px;
    cursor: pointer;
  }

  #login-form button:hover { background: var(--accent-hover); }
  #login-form button:disabled { opacity: 0.6; cursor: default; }

  #login-error {
    color: var(--danger);
    font-size: 13px;
    margin-top: 10px;
    min-height: 16px;
  }

  /* ---------- App ---------- */
  #app {
    display: none;
    height: 100%;
    flex-direction: column;
    max-width: 1080px;
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
      max(28px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  header .mark {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  header .logout {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    font-family: var(--mono);
  }
  header .logout:hover { color: var(--text); }

  .lang-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .lang-bar select {
    flex: 1 1 0;
    min-width: 0;
  }

  select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 8px 10px;
    font-family: var(--mono);
    font-size: 16px; /* evita el auto-zoom de iOS al enfocar el select */
    outline: none;
  }

  @media (min-width: 480px) {
    select { font-size: 13px; }
  }

  #swap-btn {
    flex-shrink: 0;
    background: none;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    width: 32px;
    height: 32px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }
  #swap-btn:hover { color: var(--accent); border-color: var(--accent-dim); }

  #mode-toggle {
    flex-shrink: 0;
    background: none;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    border-radius: 6px;
    padding: 8px 12px;
    font-family: var(--mono);
    font-size: 13px;
    cursor: pointer;
  }
  #mode-toggle:hover { color: var(--accent); border-color: var(--accent-dim); }

  .theme-toggle {
    flex-shrink: 0;
    background: none;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    width: 32px;
    height: 32px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .theme-toggle:hover { color: var(--accent); border-color: var(--accent-dim); }
  .theme-toggle svg { width: 17px; height: 17px; }

  .panes {
    display: flex;
    flex: 1;
    gap: 1px;
    background: var(--panel-border);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
    min-height: 320px;
  }

  .pane {
    flex: 1;
    background: var(--panel);
    display: flex;
    flex-direction: column;
  }

  .pane textarea {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 16px;
    line-height: 1.5;
    padding: 16px;
    resize: none;
    outline: none;
    font-family: var(--sans);
  }

  .pane textarea::placeholder { color: var(--text-dim); }

  .pane-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  .pane-footer button {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 12px;
  }
  .pane-footer button:hover { color: var(--accent); }

  .pane-footer-actions {
    display: flex;
    gap: 12px;
  }

  #status {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
    min-height: 16px;
  }
  #status.error { color: var(--danger); }

  /* ---------- Aviso de actualización ---------- */
  #update-banner {
    display: none;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 12px max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
    background: var(--panel);
    border-top: 1px solid var(--panel-border);
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
  }
  #update-banner.visible { display: flex; }

  #update-banner .update-reload {
    background: var(--accent);
    color: #0d1210;
    border: none;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-family: var(--mono);
    font-size: 13px;
  }
  #update-banner .update-reload:hover { background: var(--accent-hover); }

  #update-banner .update-dismiss {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 4px;
  }
  #update-banner .update-dismiss:hover { color: var(--text); }

  @media (max-width: 640px) {
    .panes { flex-direction: column; }
    .pane { min-height: 160px; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-card">
    <div class="login-card-top">
      <div class="mark">traductor/</div>
      <button id="theme-toggle-login" class="theme-toggle" type="button" aria-label="Cambiar tema"></button>
    </div>
    <h1>Acceso</h1>
    <form id="login-form" autocomplete="off">
      <label for="password" class="sr-only">Contraseña</label>
      <input type="password" id="password" placeholder="Contraseña" autofocus>
      <button type="submit" id="login-btn">Entrar</button>
      <div id="login-error"></div>
    </form>
  </div>
</div>

<div id="app">
  <header>
    <span class="mark">traductor/</span>
    <div class="header-actions">
      <button id="theme-toggle-app" class="theme-toggle" type="button" aria-label="Cambiar tema"></button>
      <button id="mode-toggle" type="button" aria-pressed="true">auto</button>
      <button class="logout" id="logout-btn">cerrar sesión</button>
    </div>
  </header>

  <div class="lang-bar">
    <select id="source-lang">
      <option value="auto">Detectar idioma</option>
      <option value="español">Español</option>
      <option value="inglés">Inglés</option>
      <option value="francés">Francés</option>
      <option value="alemán">Alemán</option>
      <option value="italiano">Italiano</option>
      <option value="portugués">Portugués</option>
      <option value="neerlandés">Neerlandés</option>
      <option value="ruso">Ruso</option>
      <option value="chino">Chino</option>
      <option value="japonés">Japonés</option>
      <option value="coreano">Coreano</option>
      <option value="árabe">Árabe</option>
    </select>

    <button id="swap-btn" title="Intercambiar idiomas" aria-label="Intercambiar idiomas">⇄</button>

    <select id="target-lang">
      <option value="inglés estadounidense">Inglés (EE. UU.)</option>
      <option value="inglés británico">Inglés (Reino Unido)</option>
      <option value="español">Español</option>
      <option value="francés">Francés</option>
      <option value="alemán">Alemán</option>
      <option value="italiano">Italiano</option>
      <option value="portugués">Portugués</option>
      <option value="neerlandés">Neerlandés</option>
      <option value="ruso">Ruso</option>
      <option value="chino">Chino</option>
      <option value="japonés">Japonés</option>
      <option value="coreano">Coreano</option>
      <option value="árabe">Árabe</option>
    </select>
  </div>

  <div class="panes">
    <div class="pane">
      <textarea id="source-text" placeholder="Escribe o pega el texto..." maxlength="8000"></textarea>
      <div class="pane-footer">
        <span id="char-count">0 / 8000</span>
        <span class="pane-footer-actions">
          <button id="translate-btn" type="button" style="display:none">traducir</button>
          <button id="clear-btn">borrar</button>
        </span>
      </div>
    </div>
    <div class="pane">
      <textarea id="target-text" placeholder="Traducción..." readonly></textarea>
      <div class="pane-footer">
        <span></span>
        <button id="copy-btn">copiar</button>
      </div>
    </div>
  </div>

  <div id="status"></div>
</div>

<div id="update-banner" role="status">
  <span>Hay una nueva versión disponible.</span>
  <button class="update-reload" id="update-reload-btn" type="button">Recargar</button>
  <button class="update-dismiss" id="update-dismiss-btn" type="button" aria-label="Cerrar aviso">✕</button>
</div>

<script>
(function () {
  const loginScreen = document.getElementById('login-screen');
  const appScreen = document.getElementById('app');
  const loginForm = document.getElementById('login-form');
  const loginBtn = document.getElementById('login-btn');
  const loginError = document.getElementById('login-error');
  const passwordInput = document.getElementById('password');

  const sourceLang = document.getElementById('source-lang');
  const targetLang = document.getElementById('target-lang');
  const sourceText = document.getElementById('source-text');
  const targetText = document.getElementById('target-text');
  const swapBtn = document.getElementById('swap-btn');
  const clearBtn = document.getElementById('clear-btn');
  const copyBtn = document.getElementById('copy-btn');
  const charCount = document.getElementById('char-count');
  const status = document.getElementById('status');
  const logoutBtn = document.getElementById('logout-btn');
  const modeToggle = document.getElementById('mode-toggle');
  const translateBtn = document.getElementById('translate-btn');
  const updateBanner = document.getElementById('update-banner');
  const updateReloadBtn = document.getElementById('update-reload-btn');
  const updateDismissBtn = document.getElementById('update-dismiss-btn');
  const themeToggleButtons = [
    document.getElementById('theme-toggle-login'),
    document.getElementById('theme-toggle-app'),
  ];

  const MAX_CHARS = 8000;
  let debounceTimer = null;
  let translateController = null;

  const MODE_KEY = 'traductorya:mode';
  let autoMode = true;
  try {
    autoMode = localStorage.getItem(MODE_KEY) !== 'manual';
  } catch {}

  function applyMode() {
    modeToggle.textContent = autoMode ? 'auto' : 'manual';
    modeToggle.setAttribute('aria-pressed', String(autoMode));
    modeToggle.title = autoMode
      ? 'Traduce mientras escribes (clic para pasar a manual)'
      : 'Traduce solo al pulsar "traducir" (clic para volver a automático)';
    translateBtn.style.display = autoMode ? 'none' : '';
  }
  applyMode();

  modeToggle.addEventListener('click', () => {
    autoMode = !autoMode;
    try {
      localStorage.setItem(MODE_KEY, autoMode ? 'auto' : 'manual');
    } catch {}
    applyMode();
  });

  translateBtn.addEventListener('click', () => {
    clearTimeout(debounceTimer);
    if (!sourceText.value.trim()) {
      targetText.value = '';
      status.textContent = '';
      return;
    }
    translate();
  });

  function showApp() {
    loginScreen.style.display = 'none';
    appScreen.style.display = 'flex';
  }

  function showLogin() {
    appScreen.style.display = 'none';
    loginScreen.style.display = 'flex';
    passwordInput.focus();
  }

  async function checkSession() {
    try {
      const res = await fetch('/api/check');
      const data = await res.json();
      if (data.authenticated) showApp();
      else showLogin();
    } catch {
      showLogin();
    }
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Comprobando...';

    try {
      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: passwordInput.value }),
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        passwordInput.value = '';
        showApp();
      } else {
        loginError.textContent = data.error || 'Contraseña incorrecta';
      }
    } catch {
      loginError.textContent = 'No se pudo conectar con el servidor';
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Entrar';
    }
  });

  logoutBtn.addEventListener('click', async () => {
    await fetch('/api/check', { method: 'POST' });
    showLogin();
  });

  // El origen solo tiene un "Inglés" genérico (no hace falta distinguir
  // variante para detectar/traducir DESDE inglés), pero el destino tiene
  // dos variantes. Al intercambiar hay que convertir entre ambos mundos.
  function toSourceLangValue(lang) {
    return lang === 'inglés estadounidense' || lang === 'inglés británico' ? 'inglés' : lang;
  }
  function toTargetLangValue(lang) {
    return lang === 'inglés' ? 'inglés estadounidense' : lang;
  }

  swapBtn.addEventListener('click', () => {
    const oldSource = sourceLang.value;
    const oldTarget = targetLang.value;

    if (oldSource === 'auto') {
      // No sabemos qué idioma detectó el origen automático, así que no hay
      // un "origen anterior" real que poner como destino: el origen pasa a
      // ser el destino actual, y el destino cae a un valor por defecto
      // razonable (evitando dejar origen y destino en el mismo idioma).
      sourceLang.value = toSourceLangValue(oldTarget);
      targetLang.value = oldTarget === 'español' ? toTargetLangValue('inglés') : 'español';
    } else {
      sourceLang.value = toSourceLangValue(oldTarget);
      targetLang.value = toTargetLangValue(oldSource);
    }

    sourceText.value = targetText.value;
    targetText.value = '';
    updateCharCount();
    triggerTranslate();
  });

  clearBtn.addEventListener('click', () => {
    sourceText.value = '';
    targetText.value = '';
    updateCharCount();
    status.textContent = '';
  });

  copyBtn.addEventListener('click', async () => {
    if (!targetText.value) return;
    await navigator.clipboard.writeText(targetText.value);
    copyBtn.textContent = 'copiado';
    setTimeout(() => (copyBtn.textContent = 'copiar'), 1200);
  });

  function updateCharCount() {
    charCount.textContent = `${sourceText.value.length} / ${MAX_CHARS}`;
  }

  // Red de seguridad: pese a la instrucción, algunos modelos a veces
  // envuelven la traducción entre comillas. No recorta espacios/saltos de
  // línea para no tocar el formato del original.
  const QUOTE_PAIRS = [['"', '"'], ["'", "'"], ['`', '`'], ['“', '”'], ['«', '»']];
  function stripWrappingQuotes(text) {
    for (const [open, close] of QUOTE_PAIRS) {
      if (text.startsWith(open) && text.endsWith(close) && text.length > open.length + close.length) {
        return text.slice(open.length, text.length - close.length);
      }
    }
    return text;
  }

  function triggerTranslate() {
    clearTimeout(debounceTimer);
    if (!sourceText.value.trim()) {
      targetText.value = '';
      status.textContent = '';
      return;
    }
    debounceTimer = setTimeout(translate, 500);
  }

  async function translate() {
    if (translateController) translateController.abort();
    const controller = new AbortController();
    translateController = controller;

    status.classList.remove('error');
    status.textContent = 'Traduciendo...';
    targetText.value = '';

    try {
      const res = await fetch('/api/translate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text: sourceText.value,
          sourceLang: sourceLang.value,
          targetLang: targetLang.value,
        }),
        signal: controller.signal,
      });

      if (res.status === 401) {
        showLogin();
        return;
      }
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        status.classList.add('error');
        status.textContent = data.error || 'Error al traducir';
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        targetText.value += decoder.decode(value, { stream: true });
      }
      targetText.value = stripWrappingQuotes(targetText.value);
      status.textContent = '';
    } catch (err) {
      if (err.name === 'AbortError') return;
      status.classList.add('error');
      status.textContent = 'No se pudo conectar con el servidor';
    }
  }

  sourceText.addEventListener('input', () => {
    updateCharCount();
    if (autoMode) triggerTranslate();
  });
  sourceLang.addEventListener('change', triggerTranslate);
  targetLang.addEventListener('change', triggerTranslate);

  function registerServiceWorker() {
    if (!('serviceWorker' in navigator)) return;

    navigator.serviceWorker.register('/sw.js').then((registration) => {
      // Ya hay una actualización esperando de una visita anterior.
      if (registration.waiting && registration.active) {
        updateBanner.classList.add('visible');
      }

      registration.addEventListener('updatefound', () => {
        const newWorker = registration.installing;
        if (!newWorker) return;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            updateBanner.classList.add('visible');
          }
        });
      });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') registration.update();
      });

      updateReloadBtn.addEventListener('click', () => {
        if (registration.waiting) registration.waiting.postMessage('SKIP_WAITING');
      });
    });

    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  }

  updateDismissBtn.addEventListener('click', () => {
    updateBanner.classList.remove('visible');
  });

  const THEME_KEY = 'traductorya:theme';
  const SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
  const MOON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  }

  function applyThemeUI() {
    const theme = currentTheme();
    const icon = theme === 'light' ? SUN_ICON : MOON_ICON;
    const title = theme === 'light'
      ? 'Tema claro (clic para pasar a oscuro)'
      : 'Tema oscuro (clic para pasar a claro)';
    themeToggleButtons.forEach((btn) => {
      btn.innerHTML = icon;
      btn.title = title;
    });
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'light' ? '#f5f6f8' : '#12151a');
  }
  applyThemeUI();

  themeToggleButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      const next = currentTheme() === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      try {
        localStorage.setItem(THEME_KEY, next);
      } catch {}
      applyThemeUI();
    });
  });

  // Si el usuario no ha elegido nunca a mano, sigue el tema del sistema
  // aunque cambie mientras la app está abierta.
  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', (e) => {
    let stored = null;
    try {
      stored = localStorage.getItem(THEME_KEY);
    } catch {}
    if (stored === 'light' || stored === 'dark') return;
    document.documentElement.setAttribute('data-theme', e.matches ? 'light' : 'dark');
    applyThemeUI();
  });

  registerServiceWorker();
  checkSession();
})();
</script>
