<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Traductor</title>

<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#12151a">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Traductor">
<style>
  :root {
    --bg: #12151a;
    --panel: #1a1f27;
    --panel-border: #262d38;
    --text: #e7e9ec;
    --text-dim: #8a93a3;
    --accent: #55b3a4;
    --accent-dim: #3d8577;
    --danger: #d9776a;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }

  /* Scrollbars a juego con el diseño oscuro (Firefox) */
  html {
    scrollbar-width: thin;
    scrollbar-color: var(--panel-border) var(--bg);
  }
  textarea {
    scrollbar-width: thin;
    scrollbar-color: var(--panel-border) var(--panel);
  }

  /* Scrollbars a juego con el diseño oscuro (Chrome, Safari, Edge) */
  ::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: var(--panel-border);
    border-radius: 6px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--accent-dim);
  }

  /* ---------- Login ---------- */
  #login-screen {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  #login-card {
    width: 100%;
    max-width: 340px;
    text-align: left;
  }

  #login-card .mark {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.02em;
    margin-bottom: 6px;
  }

  #login-card h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 24px;
  }

  #login-card input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-size: 15px;
    padding: 12px 14px;
    border-radius: 8px;
    outline: none;
    font-family: var(--sans);
  }

  #login-card input:focus {
    border-color: var(--accent-dim);
  }

  #login-card button {
    width: 100%;
    margin-top: 12px;
    background: var(--accent);
    color: #0d1210;
    border: none;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 14px;
    border-radius: 8px;
    cursor: pointer;
  }

  #login-card button:hover { background: #67c2b3; }
  #login-card button:disabled { opacity: 0.6; cursor: default; }

  #login-error {
    color: var(--danger);
    font-size: 13px;
    margin-top: 10px;
    min-height: 16px;
  }

  /* ---------- App ---------- */
  #app {
    display: none;
    height: 100%;
    flex-direction: column;
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px 20px 28px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  header .mark {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
  }

  header .logout {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    font-family: var(--mono);
  }
  header .logout:hover { color: var(--text); }

  .lang-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 8px 10px;
    font-family: var(--mono);
    font-size: 13px;
    outline: none;
  }

  #swap-btn {
    background: none;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    width: 32px;
    height: 32px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }
  #swap-btn:hover { color: var(--accent); border-color: var(--accent-dim); }

  #mode-toggle {
    margin-left: auto;
    background: none;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    border-radius: 6px;
    padding: 8px 12px;
    font-family: var(--mono);
    font-size: 13px;
    cursor: pointer;
  }
  #mode-toggle:hover { color: var(--accent); border-color: var(--accent-dim); }

  .panes {
    display: flex;
    flex: 1;
    gap: 1px;
    background: var(--panel-border);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    overflow: hidden;
    min-height: 320px;
  }

  .pane {
    flex: 1;
    background: var(--panel);
    display: flex;
    flex-direction: column;
  }

  .pane textarea {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 16px;
    line-height: 1.5;
    padding: 16px;
    resize: none;
    outline: none;
    font-family: var(--sans);
  }

  .pane textarea::placeholder { color: var(--text-dim); }

  .pane-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  .pane-footer button {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 12px;
  }
  .pane-footer button:hover { color: var(--accent); }

  .pane-footer-actions {
    display: flex;
    gap: 12px;
  }

  #status {
    margin-top: 10px;
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
    min-height: 16px;
  }
  #status.error { color: var(--danger); }

  @media (max-width: 640px) {
    .panes { flex-direction: column; }
    .pane { min-height: 160px; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-card">
    <div class="mark">traductor/</div>
    <h1>Acceso</h1>
    <form id="login-form" autocomplete="off">
      <label for="password" class="sr-only">Contraseña</label>
      <input type="password" id="password" placeholder="Contraseña" autofocus>
      <button type="submit" id="login-btn">Entrar</button>
      <div id="login-error"></div>
    </form>
  </div>
</div>

<div id="app">
  <header>
    <span class="mark">traductor/</span>
    <button class="logout" id="logout-btn">cerrar sesión</button>
  </header>

  <div class="lang-bar">
    <select id="source-lang">
      <option value="auto">Detectar idioma</option>
      <option value="español">Español</option>
      <option value="inglés">Inglés</option>
      <option value="francés">Francés</option>
      <option value="alemán">Alemán</option>
      <option value="italiano">Italiano</option>
      <option value="portugués">Portugués</option>
      <option value="neerlandés">Neerlandés</option>
      <option value="ruso">Ruso</option>
      <option value="chino">Chino</option>
      <option value="japonés">Japonés</option>
      <option value="coreano">Coreano</option>
      <option value="árabe">Árabe</option>
    </select>

    <button id="swap-btn" title="Intercambiar idiomas" aria-label="Intercambiar idiomas">⇄</button>

    <select id="target-lang">
      <option value="inglés">Inglés</option>
      <option value="español">Español</option>
      <option value="francés">Francés</option>
      <option value="alemán">Alemán</option>
      <option value="italiano">Italiano</option>
      <option value="portugués">Portugués</option>
      <option value="neerlandés">Neerlandés</option>
      <option value="ruso">Ruso</option>
      <option value="chino">Chino</option>
      <option value="japonés">Japonés</option>
      <option value="coreano">Coreano</option>
      <option value="árabe">Árabe</option>
    </select>

    <button id="mode-toggle" type="button" aria-pressed="true">auto</button>
  </div>

  <div class="panes">
    <div class="pane">
      <textarea id="source-text" placeholder="Escribe o pega el texto..." maxlength="8000"></textarea>
      <div class="pane-footer">
        <span id="char-count">0 / 8000</span>
        <span class="pane-footer-actions">
          <button id="translate-btn" type="button" style="display:none">traducir</button>
          <button id="clear-btn">borrar</button>
        </span>
      </div>
    </div>
    <div class="pane">
      <textarea id="target-text" placeholder="Traducción..." readonly></textarea>
      <div class="pane-footer">
        <span></span>
        <button id="copy-btn">copiar</button>
      </div>
    </div>
  </div>

  <div id="status"></div>
</div>

<script>
(function () {
  const loginScreen = document.getElementById('login-screen');
  const appScreen = document.getElementById('app');
  const loginForm = document.getElementById('login-form');
  const loginBtn = document.getElementById('login-btn');
  const loginError = document.getElementById('login-error');
  const passwordInput = document.getElementById('password');

  const sourceLang = document.getElementById('source-lang');
  const targetLang = document.getElementById('target-lang');
  const sourceText = document.getElementById('source-text');
  const targetText = document.getElementById('target-text');
  const swapBtn = document.getElementById('swap-btn');
  const clearBtn = document.getElementById('clear-btn');
  const copyBtn = document.getElementById('copy-btn');
  const charCount = document.getElementById('char-count');
  const status = document.getElementById('status');
  const logoutBtn = document.getElementById('logout-btn');
  const modeToggle = document.getElementById('mode-toggle');
  const translateBtn = document.getElementById('translate-btn');

  const MAX_CHARS = 8000;
  let debounceTimer = null;
  let translateController = null;

  const MODE_KEY = 'traductorya:mode';
  let autoMode = true;
  try {
    autoMode = localStorage.getItem(MODE_KEY) !== 'manual';
  } catch {}

  function applyMode() {
    modeToggle.textContent = autoMode ? 'auto' : 'manual';
    modeToggle.setAttribute('aria-pressed', String(autoMode));
    modeToggle.title = autoMode
      ? 'Traduce mientras escribes (clic para pasar a manual)'
      : 'Traduce solo al pulsar "traducir" (clic para volver a automático)';
    translateBtn.style.display = autoMode ? 'none' : '';
  }
  applyMode();

  modeToggle.addEventListener('click', () => {
    autoMode = !autoMode;
    try {
      localStorage.setItem(MODE_KEY, autoMode ? 'auto' : 'manual');
    } catch {}
    applyMode();
  });

  translateBtn.addEventListener('click', () => {
    clearTimeout(debounceTimer);
    if (!sourceText.value.trim()) {
      targetText.value = '';
      status.textContent = '';
      return;
    }
    translate();
  });

  function showApp() {
    loginScreen.style.display = 'none';
    appScreen.style.display = 'flex';
  }

  function showLogin() {
    appScreen.style.display = 'none';
    loginScreen.style.display = 'flex';
    passwordInput.focus();
  }

  async function checkSession() {
    try {
      const res = await fetch('/api/check');
      const data = await res.json();
      if (data.authenticated) showApp();
      else showLogin();
    } catch {
      showLogin();
    }
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Comprobando...';

    try {
      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: passwordInput.value }),
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        passwordInput.value = '';
        showApp();
      } else {
        loginError.textContent = data.error || 'Contraseña incorrecta';
      }
    } catch {
      loginError.textContent = 'No se pudo conectar con el servidor';
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Entrar';
    }
  });

  logoutBtn.addEventListener('click', async () => {
    await fetch('/api/check', { method: 'POST' });
    showLogin();
  });

  swapBtn.addEventListener('click', () => {
    if (sourceLang.value === 'auto') return;
    const a = sourceLang.value;
    sourceLang.value = targetLang.value;
    targetLang.value = a;
    sourceText.value = targetText.value;
    targetText.value = '';
    updateCharCount();
    triggerTranslate();
  });

  clearBtn.addEventListener('click', () => {
    sourceText.value = '';
    targetText.value = '';
    updateCharCount();
    status.textContent = '';
  });

  copyBtn.addEventListener('click', async () => {
    if (!targetText.value) return;
    await navigator.clipboard.writeText(targetText.value);
    copyBtn.textContent = 'copiado';
    setTimeout(() => (copyBtn.textContent = 'copiar'), 1200);
  });

  function updateCharCount() {
    charCount.textContent = `${sourceText.value.length} / ${MAX_CHARS}`;
  }

  function triggerTranslate() {
    clearTimeout(debounceTimer);
    if (!sourceText.value.trim()) {
      targetText.value = '';
      status.textContent = '';
      return;
    }
    debounceTimer = setTimeout(translate, 500);
  }

  async function translate() {
    if (translateController) translateController.abort();
    const controller = new AbortController();
    translateController = controller;

    status.classList.remove('error');
    status.textContent = 'Traduciendo...';
    targetText.value = '';

    try {
      const res = await fetch('/api/translate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text: sourceText.value,
          sourceLang: sourceLang.value,
          targetLang: targetLang.value,
        }),
        signal: controller.signal,
      });

      if (res.status === 401) {
        showLogin();
        return;
      }
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        status.classList.add('error');
        status.textContent = data.error || 'Error al traducir';
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        targetText.value += decoder.decode(value, { stream: true });
      }
      status.textContent = '';
    } catch (err) {
      if (err.name === 'AbortError') return;
      status.classList.add('error');
      status.textContent = 'No se pudo conectar con el servidor';
    }
  }

  sourceText.addEventListener('input', () => {
    updateCharCount();
    if (autoMode) triggerTranslate();
  });
  sourceLang.addEventListener('change', triggerTranslate);
  targetLang.addEventListener('change', triggerTranslate);

  checkSession();
})();
</script>

</body>
</html>
